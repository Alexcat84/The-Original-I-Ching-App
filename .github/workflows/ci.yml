name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Disable corepack (prevents yarn/npm interception during build)
        run: corepack disable

      - name: Upgrade npm to match lockfile generator
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Install rollup Linux binary (cross-platform lockfile limitation)
        run: npm install @rollup/rollup-linux-x64-gnu --no-save --ignore-scripts

      - name: Type check
        run: npm run typecheck

      # next lint + eslint-config-next puede fallar con hoisting npm en monorepo (parser babel).
      # Descomenta cuando `npm run lint` pase en local.
      # - name: Lint
      #   run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # next/font/google hits fonts.gstatic.com; skip in CI to avoid flaky timeouts / blocks.
          SKIP_GOOGLE_FONTS: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
