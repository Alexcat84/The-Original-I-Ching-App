name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Disable corepack (prevents yarn/npm interception during build)
        run: corepack disable

      - name: Install yarn without packageManager startup check
        run: npm install -g yarn@1.22.19

      - name: Use npm@10.9.2 (declared packageManager / lockfile generator)
        run: npm install -g npm@10.9.2

      - name: Report toolchain versions
        run: |
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Install dependencies
        run: npm ci

      - name: Install rollup Linux binary (cross-platform lockfile limitation)
        run: npm install @rollup/rollup-linux-x64-gnu --no-save --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: i18n audit
        run: npm run i18n:audit

      # next lint + eslint-config-next puede fallar con hoisting npm en monorepo (parser babel).
      # Descomenta cuando `npm run lint` pase en local.
      # - name: Lint
      #   run: npm run lint

      - name: Test
        run: npm test

      # Full 64x63 (Wilhelm + Legge) overlay-title pair grid, ~4 min — deliberately not
      # part of `npm test` (would slow down every local run). Always runs in CI as its
      # own step, not behind an opt-in flag — see TS-WEB-OVR-004 /
      # docs/auditorias/20260627-AUD-IMG-OVR-03-khwan-resvg-regression.md for why an
      # env-var-gated render test is exactly the gap that let the original bug ship.
      - name: Overlay title exhaustive render check
        run: npm run test:overlay-exhaustive --prefix apps/web

      - name: Build
        run: npm run build
        env:
          # next/font/google hits fonts.gstatic.com; skip in CI to avoid flaky timeouts / blocks.
          SKIP_GOOGLE_FONTS: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NODE_OPTIONS: "--max-old-space-size=4096"

  # RLS cross-user isolation test (Ticket B, PLAN-SEC-01; closes EXT-SEC-02 P1-2).
  # Runs the *.rls.test.ts suite against a real local Supabase stack (Postgres 17
  # with the 74 migrations applied), authenticated as two different users.
  # Non-blocking at first; flip to blocking once trusted (same pattern as
  # resolution-guard). See docs/auditorias/20260716-GATE-SEC-01.
  rls-test:
    runs-on: ubuntu-latest
    continue-on-error: true # informational at first; flip to blocking once trusted
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Disable corepack
        run: corepack disable

      - name: Use npm@10.9.2 (declared packageManager / lockfile generator)
        run: npm install -g npm@10.9.2

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Report toolchain versions
        run: |
          echo "node:     $(node -v)"
          echo "npm:      $(npm -v)"
          echo "supabase: $(supabase --version)"

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply the 74 migrations + seed
        run: supabase db reset

      - name: Export local stack keys into the test environment
        run: supabase status -o env | grep -E "^(ANON_KEY|SERVICE_ROLE_KEY|API_URL)=" | tr -d '"' >> "$GITHUB_ENV"

      - name: Run RLS isolation suite
        run: npm run test:rls --workspace @iching-oracle/web
        env:
          SUPABASE_URL: ${{ env.API_URL }}

  # Blocking guard for the two monorepo resolution fragilities (react 18/19 split):
  # regenerates the lockfile from scratch and FAILS the PR on ERESOLVE or a wrong
  # react split (web 18.x / mobile 19.0.0). Uses npm@10.9.2 (the declared
  # packageManager that generated the committed lockfile); npm@11 ERESOLVEs on the
  # load-bearing expo-app-integrity peer override. The hoisting-non-determinism WARN
  # (root != web) stays a non-blocking warning inside the script — the flip only
  # made the already-passing assertion mandatory; it did not change the failure bar.
  # Trade-off: the regen step hits the npm registry on every PR, so a transient
  # network hiccup could go red. If reds ever come from network flakiness (not real
  # resolution), add a retry to the regen step — do NOT revert to continue-on-error.
  # See docs/auditorias/20260713-AUD-WEB-02-monorepo-resolution-blocker.md.
  resolution-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Disable corepack
        run: corepack disable

      - name: Use npm@10.9.2 (declared packageManager / lockfile generator)
        run: npm install -g npm@10.9.2

      - name: Report toolchain versions
        run: |
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Regenerate lockfile from scratch (no flags — must resolve without ERESOLVE)
        run: |
          rm -f package-lock.json
          npm install --package-lock-only

      - name: Assert react split (web 18.x, mobile 19.0.0) + report hoisting
        run: node .github/scripts/check-react-resolution.mjs
